  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"011cdf20-2e89-4b99-a793-4dfc9f2ef777\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b0e2bd5f-d5d0-4e7d-998e-abef26d0a408\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4e8f19c2-d0bf-4275-834f-c899194cac63\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"53bf115e-d1a6-43d4-826b-3eb8424d3936\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2fbfa110-6a7e-48fc-abd5-b99955517875\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Wysdom Solutions — Privacy site\n   Brand-matched to wysdomsolutions.com (wysdom-site).\n   Navy #0C3C5D · Owl Gold #C8A24A · Sora / Source Sans 3 / JetBrains Mono\n\n   These are long legal documents. Readability leads; the brand\n   sits in a slim top bar + footer and stays out of the prose.\n   One template drives every page: the company policy (base) and\n   each per-app policy. See _template/ for the starting point.\n   ============================================================ */\n\n:root{\n  --accent:#C8A24A; --accent-deep:#836828; --gold-300:#DBBA5F; --gold-100:#F4EAC8; --gold-50:#FBF7EC;\n  --ink:#1A1916; --ink-strong:#051C2D; --muted:#5A5749; --faint:#7C7869;\n  --bg:#FAFAF7; --card:#FFFFFF; --sunken:#F4F3EE; --hairline:#E7E5DD; --hairline-2:#D2CFC4;\n  --navy:#0C3C5D; --navy-600:#154E70; --navy-700:#0C3C5D; --navy-800:#082C45; --navy-900:#051C2D;\n  --navy-100:#DCE6EE; --navy-200:#B6C8D7; --navy-500:#245F82;\n  --readw:720px; --shellw:1080px;\n  --font-display:'Sora',system-ui,sans-serif;\n  --font-body:'Source Sans 3',system-ui,sans-serif;\n  --font-mono:'JetBrains Mono',ui-monospace,monospace;\n}\n*,*::before,*::after{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);\n  line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\na{color:inherit;}\n::selection{background:var(--accent);color:var(--navy-900);}\n\n/* ---------- slim sticky top bar (brand, no hero) ---------- */\n.topbar{position:sticky;top:0;z-index:50;background:rgba(250,250,247,.85);\n  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline);\n  border-top:3px solid var(--accent);}\n.topbar .bar{max-width:var(--shellw);margin:0 auto;padding:13px 36px;\n  display:flex;align-items:center;justify-content:space-between;gap:18px;}\n.topbar .brand{display:flex;align-items:center;gap:11px;text-decoration:none;}\n.topbar .brand img{height:30px;width:auto;display:block;}\n.topbar .brand .nm{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--navy);letter-spacing:-.01em;}\n.topbar nav{display:flex;align-items:center;gap:22px;}\n.topbar nav a{font-family:var(--font-display);font-size:13.5px;font-weight:500;color:var(--muted);\n  text-decoration:none;transition:color .15s;white-space:nowrap;}\n.topbar nav a:hover,.topbar nav a.here{color:var(--navy);}\n\n/* ---------- document shell: contents rail + reading column ---------- */\n.docwrap{max-width:var(--shellw);margin:0 auto;padding:52px 36px 84px;}\n.doc{max-width:var(--readw);margin:0 auto;}\n@media(min-width:1000px){\n  .docwrap{display:grid;grid-template-columns:200px minmax(0,var(--readw));\n    justify-content:center;column-gap:56px;align-items:start;}\n  .doc{max-width:none;margin:0;}\n}\n\n/* contents rail (built by privacy.js; absent/empty = no rail) */\n.toc{display:none;}\n@media(min-width:1000px){\n  .toc{display:block;position:sticky;top:84px;}\n}\n.toc .lbl{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.09em;\n  text-transform:uppercase;color:var(--accent-deep);display:block;margin:0 0 14px 14px;}\n.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-left:1px solid var(--hairline);}\n.toc a{display:block;font-family:var(--font-body);font-size:13.5px;line-height:1.35;color:var(--faint);\n  text-decoration:none;padding:7px 0 7px 14px;margin-left:-1px;border-left:2px solid transparent;transition:color .15s,border-color .15s;}\n.toc a:hover{color:var(--navy);}\n.toc a.active{color:var(--navy);font-weight:600;border-left-color:var(--accent);}\n\n/* ---------- document header ---------- */\n.dochead{padding-bottom:26px;border-bottom:1px solid var(--hairline);margin-bottom:36px;}\n.dochead .eyebrow{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.13em;\n  text-transform:uppercase;color:var(--accent-deep);margin:0 0 16px;}\n.dochead h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4.4vw,44px);\n  line-height:1.08;letter-spacing:-.025em;color:var(--navy);margin:0;}\n.dochead .lead{font-size:19px;line-height:1.55;color:var(--muted);margin:18px 0 0;max-width:58ch;}\n.dochead .updated{font-family:var(--font-mono);font-size:13px;color:var(--faint);\n  margin:22px 0 0;display:flex;align-items:center;gap:9px;}\n.dochead .updated b{color:var(--accent-deep);font-weight:500;}\n.dochead .updated .pin{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;}\n\n/* ---------- at-a-glance summary (replaces the navy chip band) ---------- */\n.summary{background:var(--card);border:1px solid var(--hairline);border-radius:12px;\n  padding:22px 24px 24px;margin:0 0 40px;}\n.summary .lbl{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;\n  text-transform:uppercase;color:var(--accent-deep);display:block;margin:0 0 15px;}\n.summary ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;}\n.summary li{display:flex;align-items:flex-start;gap:11px;font-size:16px;line-height:1.45;color:var(--ink-strong);}\n.summary li svg{width:17px;height:17px;color:var(--navy-500);flex:none;margin-top:1px;}\n\n/* ---------- prose body ---------- */\n.doc h2{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.015em;\n  line-height:1.25;color:var(--navy);margin:42px 0 12px;scroll-margin-top:84px;}\n.doc h2:first-child{margin-top:0;}\n.doc p{font-size:17px;line-height:1.7;color:var(--ink);margin:0 0 16px;}\n.doc strong{font-weight:600;color:var(--ink-strong);}\n.doc ul:not(.summary ul):not(.applist){margin:4px 0 20px;padding:0;list-style:none;\n  display:flex;flex-direction:column;gap:10px;}\n.doc li:not(.summary li):not(.applist li){font-size:16.5px;line-height:1.6;color:var(--ink);\n  padding-left:22px;position:relative;}\n.doc ul:not(.summary ul):not(.applist) li::before{content:\"\";position:absolute;left:5px;top:11px;\n  width:5px;height:5px;border-radius:50%;background:var(--accent-deep);}\n.doc a{color:var(--navy);text-decoration-line:underline;text-decoration-color:var(--accent);\n  text-decoration-thickness:1px;text-underline-offset:3px;font-weight:500;}\n.doc a:hover{text-decoration-color:var(--navy);}\n\n/* not-collected / emphasis callout — calm, not gold-filled */\n.callout{background:var(--sunken);border:1px solid var(--hairline);border-left:3px solid var(--accent);\n  border-radius:10px;padding:16px 20px;margin:6px 0 22px;}\n.callout .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;\n  color:var(--accent-deep);display:block;margin-bottom:7px;}\n.callout p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-strong);}\n\n/* ---------- in-document app directory ---------- */\n.applist{list-style:none;margin:8px 0 8px;padding:0;display:flex;flex-direction:column;gap:12px;}\n.applist a{display:flex;align-items:center;gap:18px;text-decoration:none;border:1px solid var(--hairline);\n  border-radius:12px;padding:18px 20px;background:var(--card);transition:border-color .18s,box-shadow .18s;}\n.applist a:hover{border-color:var(--navy-200);box-shadow:0 2px 8px rgba(8,44,69,.07);}\n.applist .txt{flex:1;min-width:0;}\n.applist .nm{display:block;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--navy);letter-spacing:-.01em;margin:0 0 4px;}\n.applist .ds{display:block;font-size:14.5px;line-height:1.45;color:var(--muted);margin:0;}\n.applist .go{font-family:var(--font-mono);font-size:12px;color:var(--accent-deep);white-space:nowrap;\n  display:inline-flex;align-items:center;gap:6px;}\n.applist .go svg{width:14px;height:14px;transition:transform .18s ease;}\n.applist a:hover .go svg{transform:translateX(3px);}\n\n/* ---------- contact block — restrained, end of document ---------- */\n.contactblock{border:1px solid var(--hairline);background:var(--sunken);border-radius:12px;\n  padding:24px 26px;margin:48px 0 0;}\n.doc .contactblock h2{font-size:20px;margin:0 0 8px;}\n.contactblock p{font-size:16px;line-height:1.6;color:var(--muted);margin:0;}\n.contactblock a.mail{font-family:var(--font-mono);font-size:14px;color:var(--navy);text-decoration:none;\n  border-bottom:1px solid var(--accent);padding-bottom:2px;display:inline-block;margin-top:14px;}\n.contactblock a.mail:hover{border-bottom-color:var(--navy);}\n.contactblock .dev{font-family:var(--font-mono);font-size:12px;color:var(--faint);margin-top:14px;}\n\n/* ---------- footer ---------- */\nfooter{background:var(--navy-900);color:var(--bg);padding:40px 0 32px;}\nfooter .wrap{max-width:var(--shellw);margin:0 auto;padding:0 36px;}\n.footrow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:56px;}\n.footbrand{display:flex;align-items:center;gap:12px;}\n.footbrand img{height:38px;width:auto;display:block;}\n.footname{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--bg);letter-spacing:-.01em;}\n.footdesc{font-size:14px;color:rgba(250,250,247,.62);width:440px;max-width:100%;margin:0;line-height:1.5;text-align:right;justify-self:end;}\n.footbase{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:30px;padding-top:22px;\n  border-top:1px solid rgba(255,255,255,.12);flex-wrap:wrap;}\n.footbase span{font-family:var(--font-mono);font-size:12px;color:rgba(250,250,247,.5);}\n.footbase .links{display:flex;gap:22px;}\n.footbase a{font-size:13px;color:rgba(250,250,247,.6);text-decoration:none;}\n.footbase a:hover{color:var(--accent);}\n\n/* ---------- responsive ---------- */\n@media(max-width:560px){\n  .topbar .bar{padding:12px 20px;}\n  .topbar nav{gap:16px;}\n  .docwrap{padding:36px 20px 64px;}\n  footer .wrap{padding:0 20px;}\n  .footrow{grid-template-columns:1fr;gap:24px;}\n  .footdesc{text-align:left;width:100%;justify-self:start;}\n  .applist a{flex-direction:column;align-items:flex-start;gap:10px;}\n}\n\n/* ---------- print / save-as-PDF (legal docs get printed) ---------- */\n@media print{\n  .topbar,.toc,footer{display:none !important;}\n  body{background:#fff;color:#000;}\n  .docwrap{display:block;max-width:100%;margin:0;padding:0;}\n  .doc{max-width:100%;margin:0;}\n  .dochead h1,.doc h2,.contactblock h2{color:#000;}\n  .doc p,.doc li,.summary li,.callout p,.contactblock p{color:#000;}\n  .doc a{color:#000;text-decoration:underline;}\n  .summary,.callout,.contactblock,.applist a{background:#fff;border-color:#999;box-shadow:none;}\n  .dochead .eyebrow,.summary .lbl,.callout .lbl,.dochead .updated{color:#333;}\n  .dochead{border-color:#999;}\n  .doc h2{break-after:avoid;}\n  .summary,.callout,.contactblock,.applist a{break-inside:avoid;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<!--\n  =========================================================================\n  Company privacy policy. Content backbone from the reviewed draft; presented\n  on the shared template. Still worth a final pass for legal sign-off and to\n  keep each app page matched to its App Store / Google Play data-safety form.\n  Add or remove <h2> sections freely — the contents rail rebuilds itself.\n  =========================================================================\n-->\n<body>\n<header class=\"topbar\">\n  <div class=\"bar\" data-comment-anchor=\"37bc77873d-div\">\n    <a class=\"brand\" href=\"./\"><img src=\"150cb87f-390a-465c-a0fd-2236cfe7c930\" alt=\"\"><span class=\"nm\">Wysdom Solutions<\u002Fspan><\u002Fa>\n    <nav>\n      <a href=\"#our-apps\">App policies<\u002Fa>\n      <a href=\"https://wysdomsolutions.com\">Studio site<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"docwrap\" data-screen-label=\"Company privacy policy\">\n  <aside class=\"toc\" aria-label=\"Contents\"><\u002Faside>\n\n  <article class=\"doc\">\n    <div class=\"dochead\">\n      <p class=\"eyebrow\">Privacy<\u002Fp>\n      <h1>Privacy at Wysdom Solutions<\u002Fh1>\n      <p class=\"lead\">We build software that keeps your data on your device. This policy lays out what we do with information across our apps and this website, in plain language. Short version: very little.<\u002Fp>\n      <p class=\"updated\"><span class=\"pin\"><\u002Fspan>Last updated <b>June 3, 2026<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n\n    <section class=\"summary\" aria-label=\"At a glance\">\n      <span class=\"lbl\">At a glance<\u002Fspan>\n      <ul>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Our apps store your data on your device, with no accounts and no cloud.<\u002Fli>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>This website sets no cookies and runs no analytics.<\u002Fli>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>The only data we collect is what you send through our contact form.<\u002Fli>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>We don't sell or rent your information. Each app has its own policy below.<\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <h2>Who we are<\u002Fh2>\n    <p data-comment-anchor=\"7bf8fae251-p\">Wysdom Solutions LLC is an independent, one-person software studio in Wisconsin. We ship our own apps and take on contract engineering work. We're the \"we\" and \"us\" in this policy, and it applies to wysdomsolutions.com, this privacy site, and the apps we publish, except where an app's own policy says otherwise.<\u002Fp>\n\n    <h2>What this policy covers<\u002Fh2>\n    <p>This is the company-level policy. It covers how we handle information at Wysdom Solutions, plus the principles every one of our apps follows. Each app also has its own policy with the specifics: what it stores, what it asks for, and any outside services it uses. When an app's policy gets more specific than this one, the app's policy wins. You'll find them all in the directory below.<\u002Fp>\n\n    <h2>Our approach<\u002Fh2>\n    <p>We design for privacy first, and it's not a slogan. Our apps are built to run on your device, keeping their data local instead of shipping it to servers we run. We don't operate a backend that collects your personal information, and our business doesn't depend on ads or profiling. When an app does lean on an outside service, like crash reporting or ads on a free tier, we say so plainly in that app's policy.<\u002Fp>\n\n    <h2>What we collect on this website<\u002Fh2>\n    <p>The only personal information this website collects is what you choose to send through our contact form: your name, your email, and your message. We use it to read your note and reply. No account, no profile, nothing clever.<\u002Fp>\n\n    <h2>How our contact form works<\u002Fh2>\n    <p>The contact form is handled by <a href=\"https://web3forms.com/privacy\">Web3Forms<\u002Fa>, a third-party form-delivery service. When you submit it, your name, email, and message go to Web3Forms, which forwards them to our inbox. Web3Forms forwards rather than stores submissions on our plan, runs its servers in the United States, and says it doesn't sell or share what you send. Their practices are written up at <a href=\"https://web3forms.com/privacy\">web3forms.com/privacy<\u002Fa>. Once a message reaches our inbox, it lives there, under our control (see <a href=\"#data-retention\">Data retention<\u002Fa> below).<\u002Fp>\n\n    <h2>What our apps collect<\u002Fh2>\n    <p>As a rule, our apps keep your data on your device and send no personal data to servers we run. No accounts, no cloud sync, no central database of users. Where an app does use an outside service, like advertising or in-app purchases, its own policy names that service and links to its policy.<\u002Fp>\n\n    <h2 id=\"our-apps\">Our apps<\u002Fh2>\n    <p>Every app we ship gets its own policy, in plain language. They're the last word on what each app does. Here's the current set.<\u002Fp>\n    <ul class=\"applist\">\n      <li>\n        <a href=\"glass-buddy/\">\n          <span class=\"txt\">\n            <span class=\"nm\">Glass Buddy<\u002Fspan>\n            <span class=\"ds\">Mobile companion for glass artists. Colors, compatibility, projects, and kiln schedules.<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"go\">Read policy\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fli>\n      <li>\n        <a href=\"fuzz-noise/\">\n          <span class=\"txt\">\n            <span class=\"nm\">Fuzz Noise<\u002Fspan>\n            <span class=\"ds\">Minimal ambient sound app for sleep and focus, with layered mixes and a sleep timer.<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"go\">Read policy\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fli>\n      <li>\n        <a href=\"hench-goblin/\">\n          <span class=\"txt\">\n            <span class=\"nm\">Hench Goblin<\u002Fspan>\n            <span class=\"ds\">Fast, fully-offline workout tracker. Log exercises, sets, reps, and weight with minimal friction.<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"go\">Read policy\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fli>\n    <\u002Ful>\n\n    <h2>Cookies, analytics, and hosting<\u002Fh2>\n    <p>This site sets no cookies and runs no analytics or third-party tracking. It's a static site on GitHub Pages, so GitHub, as our host, logs routine technical details like visitor IP addresses to keep the site running and secure. That's covered by <a href=\"https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement\">GitHub's privacy statement<\u002Fa>.<\u002Fp>\n\n    <h2>How we use what you send<\u002Fh2>\n    <p>We use what you send through the contact form only to answer you, and to follow up if we need to. We don't use it for marketing, and we don't sell or rent it.<\u002Fp>\n\n    <h2>Selling, sharing, and advertising<\u002Fh2>\n    <p data-comment-anchor=\"08da2f1a05-p\">We don't sell your personal information. Wysdom Solutions runs no advertising business and doesn't build a profile of you. Some of our apps show ads through a third-party network, named in that app's policy. Depending on your settings and where you live, that network's use of a device ad identifier might count as \"sharing\" or a \"sale\" under laws like California's. You can rein it in through your device's privacy settings, and where an app offers it, a one-time purchase removes ads.<\u002Fp>\n\n    <h2 id=\"data-retention\">Data retention<\u002Fh2>\n    <p>Your app data lives on your device for as long as the app is installed, and uninstalling clears it. Messages you send us stick around in our inbox only as long as we need them to help you and keep reasonable records. Want yours gone? Just ask (see <a href=\"#your-rights\">Your rights<\u002Fa>).<\u002Fp>\n\n    <h2 id=\"your-rights\">Your rights and choices<\u002Fh2>\n    <p>Depending on where you live, including under the GDPR and CCPA, you may have the right to see, correct, or delete the personal information we hold, and to object to how we use it. Since the only thing we collect is your contact-form message, email us at <a href=\"mailto:privacy@wysdomsolutions.com\">privacy@wysdomsolutions.com<\u002Fa> and we'll find it and delete it. Our apps keep nothing on our servers, so there's nothing for us to export or delete there. Uninstalling an app wipes its local data from your device.<\u002Fp>\n\n    <h2>International users<\u002Fh2>\n    <p>Our contact form runs on Web3Forms' servers in the United States. If you write to us from outside the U.S., your message is transferred to and handled in the United States.<\u002Fp>\n\n    <h2>Data security<\u002Fh2>\n    <p>We take reasonable steps to protect what you send us. That said, no method of sending data over the internet is perfectly secure, and we can't promise absolute security.<\u002Fp>\n\n    <h2>Children's privacy<\u002Fh2>\n    <p>Our apps and site are made for general, adult audiences. We don't knowingly collect personal information from children under 13.<\u002Fp>\n\n    <h2>Changes to this policy<\u002Fh2>\n    <p>We'll update this from time to time. When we do, we'll post the new version here and change the \"last updated\" date up top. If a change is a big one, we'll say so.<\u002Fp>\n\n    <div class=\"contactblock\">\n      <h2>Contact<\u002Fh2>\n      <p>Questions or privacy requests? Drop us a line and we'll help.<\u002Fp>\n      <a class=\"mail\" href=\"mailto:privacy@wysdomsolutions.com\">privacy@wysdomsolutions.com<\u002Fa>\n      <div class=\"dev\">Wysdom Solutions LLC · Wisconsin, USA<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n<\u002Fdiv>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"footrow\">\n      <div class=\"footbrand\"><img src=\"26745b1f-4ce7-4b7d-bd80-dde72decc1a9\" alt=\"\"><span class=\"footname\">Wysdom Solutions<\u002Fspan><\u002Fdiv>\n      <p class=\"footdesc\">Independent software studio. We ship our own products, and provide engineering expertise to teams who need to ship theirs.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footbase\">\n      <span>© 2026 Wysdom Solutions LLC<\u002Fspan>\n      <div class=\"links\">\n        <a href=\"https://wysdomsolutions.com\">Studio site<\u002Fa>\n        <a href=\"mailto:privacy@wysdomsolutions.com\">privacy@wysdomsolutions.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n<script src=\"80ce1630-e0db-49fd-8071-66afe584b328\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
