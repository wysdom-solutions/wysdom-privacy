  <style>
    :root{
      --accent:#C8A24A; --gold-300:#DBBA5F;
      --ink:#051C2D; --muted:#5A5749;
      --bg:#FAFAF7; --navy:#0C3C5D;
      --font-display:'Sora',system-ui,sans-serif;
      --font-body:'Source Sans 3',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:var(--font-body); line-height:1.6;
      display:flex; align-items:center; justify-content:center; padding:32px;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    ::selection{background:var(--accent); color:var(--navy);}
    main{max-width:440px; text-align:center;}
    .mark{
      font-family:var(--font-display); font-weight:800; font-size:13px;
      letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
      margin:0 0 18px;
    }
    h1{
      font-family:var(--font-display); font-weight:800;
      font-size:clamp(30px,6vw,42px); line-height:1.08; letter-spacing:-.02em;
      color:var(--navy); margin:0 0 14px;
    }
    p{font-size:17px; color:var(--muted); margin:0 0 28px; max-width:38ch; margin-inline:auto;}
    .btn{
      display:inline-flex; align-items:center; gap:9px;
      font-family:var(--font-display); font-weight:600; font-size:15px;
      text-decoration:none; padding:13px 24px; border-radius:8px;
      background:var(--navy); color:var(--bg);
      transition:background .16s ease;
    }
    .btn:hover{background:#154E70;}
    .btn svg{width:15px; height:15px;}
  </style>
</head>
<body>
  <main>
    <p class="mark">Wysdom Solutions — Apps</p>
    <h1>Under construction</h1>
    <p>We're building the Wysdom Solutions apps hub. In the meantime, visit the studio.</p>
    <a class="btn" href="https://wysdomsolutions.com">
      Visit wysdomsolutions.com
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
  </main>
</body>
</html>
